name: Xiaomi remote server
on:
  push:
    branches: [xiaomi-remote]
    paths:
      - 'pkg/xiaomi/**'
      - 'internal/xiaomi/**'
      - '.github/workflows/xiaomi-remote-server.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./pkg/xiaomi/... ./internal/xiaomi/...
      - run: go test ./cmd/xiaomi-probe
      - run: go vet ./pkg/xiaomi/... ./internal/xiaomi/...
      - run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/go2rtc-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/go2rtc-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: go2rtc-xiaomi-remote-linux
          path: dist/
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GO_VERSION=1.26
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/timwai/go2rtc:xiaomi-remote
